      q: "Perhatikan beberapa bentuk limit fungsi trigonometri berikut. Berilah tanda centang (&#10003;) pada pernyataan-pernyataan yang memiliki nilai limit <strong>benar</strong> (jawaban benar lebih dari satu):",
      opts: [
        "\\(\\lim_{x \\to 0} \\frac{\\sin 8x}{2x} = 4\\)",
        "\\(\\lim_{x \\to 0} \\frac{\\tan 6x}{\\sin 3x} = 2\\)",
        "\\(\\lim_{x \\to 0} \\frac{1 - \\cos 4x}{x^2} = 8\\)",
        "\\(\\lim_{x \\to 0} \\frac{\\tan^2(3x)}{x^2} = 3\\)"
      ]
    },

    // Turunan (2 Soal: 39 - 40)
    {
      topik: "Turunan",
      q: "Diketahui fungsi polinomial \\(f(x) = x^3 - 6x^2 + 9x + 2\\). Berilah tanda centang (&#10003;) pada pernyataan-pernyataan berikut yang <strong>benar</strong> (jawaban benar lebih dari satu):",
      opts: [
        "Turunan pertama fungsi tersebut adalah \\(f'(x) = 3x^2 - 12x + 9\\).",
        "Fungsi \\(f(x)\\) naik pada interval \\(x < 1\\) atau \\(x > 3\\).",
        "Fungsi \\(f(x)\\) turun pada interval \\(1 < x < 3\\).",
        "Nilai balik minimum fungsi \\(f(x)\\) adalah \\(6\\)."
      ]
    },
    {
      topik: "Turunan",
      q: "Suatu pabrik memproduksi \\(x\\) unit barang dengan harga jual per unit sebesar \\((120 - 3x)\\) ribu rupiah. Berilah tanda centang (&#10003;) pada pernyataan-pernyataan berikut yang <strong>benar</strong> (jawaban benar lebih dari satu):",
      opts: [
        "Fungsi hasil penjualan total adalah \\(R(x) = 120x - 3x^2\\) ribu rupiah.",
        "Turunan pertama fungsi hasil penjualan adalah \\(R'(x) = 120 - 6x\\).",
        "Hasil penjualan mencapai maksimum jika diproduksi sebanyak \\(20\\) unit barang.",
        "Hasil penjualan maksimum yang diperoleh adalah \\(1.500\\) ribu rupiah."
      ]
    }
  ]
};

function renderPacket(packet, containerId) {
  const container = document.getElementById(containerId);
  let html = '';
  let globalNum = 1;

  // BAGIAN I: PILIHAN GANDA (1 - 24)
  html += `
    <div class="part-banner">
      <h3>BAGIAN I. PILIHAN GANDA (Nomor 1 – 24)</h3>
      <p>Pilihlah satu jawaban yang paling tepat (A, B, C, D, atau E)!</p>
    </div>
  `;
  packet.pg.forEach(item => {
    const isLong = item.opts.some(o => o.length > 42 || o.includes('pmatrix'));
    const optsHtml = item.opts.map((opt, idx) => `
      <li class="option-item">
        <span class="opt-letter">${letters[idx]}.</span>
        <span>${opt}</span>
      </li>
    `).join('');

    html += `
      <div class="question-card">
        <div class="q-title">
          <span class="q-num">${globalNum}</span>
          <div class="q-text">
            <div class="topic-tag">${item.topik}</div>
            <div>${item.q}</div>
          </div>
        </div>
        <ul class="options-list ${isLong ? 'vertical' : ''}">${optsHtml}</ul>
      </div>
    `;
    globalNum++;
  });

  // BAGIAN II: BENAR / SALAH (25 - 34)
  html += `
    <div class="part-banner">
      <h3>BAGIAN II. BENAR ATAU SALAH (Nomor 25 – 34)</h3>
      <p>Tentukan apakah pernyataan berikut bernilai <strong>Benar</strong> atau <strong>Salah</strong>!</p>
    </div>
  `;
  packet.tf.forEach(item => {
    html += `
      <div class="question-card">
        <div class="q-title">
          <span class="q-num">${globalNum}</span>
          <div class="q-text">
            <div class="topic-tag">${item.topik}</div>
            <div>${item.q}</div>
          </div>
        </div>
        <div class="tf-options">
          <span class="tf-box">&#9711; Benar</span>
          <span class="tf-box">&#9711; Salah</span>
        </div>
      </div>
    `;
    globalNum++;
  });

  // BAGIAN III: CHECKBOX (35 - 40)
  html += `
    <div class="part-banner">
      <h3>BAGIAN III. PILIHAN GANDA KOMPLEKS / CHECKBOX (Nomor 35 – 40)</h3>
      <p>Pilihlah semua pernyataan yang benar dengan memberi tanda centang (&#10003;) pada kotak yang tersedia!</p>
    </div>
  `;
  packet.cb.forEach(item => {
    const cbHtml = item.opts.map((opt, idx) => `
      <li class="cb-item">
        <span class="cb-square"></span>
        <span><strong>(${letters[idx]})</strong> ${opt}</span>
      </li>
    `).join('');

    html += `
      <div class="question-card">
        <div class="q-title">
          <span class="q-num">${globalNum}</span>
          <div class="q-text">
            <div class="topic-tag">${item.topik}</div>
            <div>${item.q}</div>
          </div>
        </div>
        <ul class="cb-list">${cbHtml}</ul>
      </div>
    `;
    globalNum++;
  });

  container.innerHTML = html;
}

renderPacket(dataTipeB, 'body-tipeB');
